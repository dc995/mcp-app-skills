name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-app-ext/mcp-server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-app-ext/mcp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:matrix
      - run: npm run smoke
      - run: npm run audit:prod
      - name: Validate repository documents and links
        working-directory: .
        run: node scripts/validate-repo.mjs
      - name: Check generated host summary
        working-directory: .
        run: node scripts/generate-host-summary.mjs --check
